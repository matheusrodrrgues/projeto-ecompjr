[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomp-stock-api"
version = "0.1.0"
description = "API de gerenciamento de estoque para o desafio da Ecomp Jr."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "anyio>=4.6,<4.10",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<0.116",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.15,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

