name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Conferir formatação
        run: ruff format --check .
      - name: Conferir código
        run: ruff check .
      - name: Rodar testes
        run: pytest -q
