name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ecomp_stock_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecomp_stock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecomp_stock_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecomp_stock_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Conferir formatação
        run: ruff format --check .
      - name: Conferir código
        run: ruff check .
      - name: Aplicar migrations
        run: alembic upgrade head
      - name: Rodar testes
        run: pytest -q
